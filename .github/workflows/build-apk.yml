name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and sync web files
        run: |
          npm ci
          npx esbuild src/main.js --bundle --minify --format=iife --target=es2019 --outfile=www/app.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGN_KEYSTORE_B64" ] && [ -n "$SIGN_PASSWORD" ]; then
            echo "$SIGN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/station.jks"
            export SIGN_KEYSTORE_PATH="$RUNNER_TEMP/station.jks"
            export SIGN_STORE_PASSWORD="$SIGN_PASSWORD" SIGN_KEY_PASSWORD="$SIGN_PASSWORD" SIGN_KEY_ALIAS=centralwater
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../central-water.apk
          else
            echo "::warning::Signing secrets are missing, building a temporary debug APK"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../central-water.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: central-water-apk
          path: central-water.apk

      - name: Publish download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: محطة الماء المركزية (آخر نسخة)
          body: نزّل ملف central-water.apk وافتحه على موبايلك حتى تنصّب التطبيق.
          files: central-water.apk
          make_latest: true
