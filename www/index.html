<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محطة الماء المركزية</title>
<link rel="stylesheet" href="leaflet.css">
<style>
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format('woff2')}
@font-face{font-family:'Plex';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plex';font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format('woff2')}
:root{--bg:#eef3f6;--card:#fff;--ink:#0c2a3a;--muted:#4d6878;--line:#d6e2ea;--navy:#0c3b56;--blue:#1479b5;--green:#2b7a4b;--amber:#a85d00;--amberbg:#fff8ee;--r:14px}
*{box-sizing:border-box}
html{background:var(--navy)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Plex,Tahoma,sans-serif;font-size:15px;line-height:1.55;min-height:100vh}
[hidden]{display:none!important}
button,input{font-family:inherit;font-size:16px}
h1{font-size:24px;margin:0}
h2{font-size:16px;margin:0 0 8px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center}.brand b{display:block;font-size:16px}.brand small{color:#bfe0f2;font-size:12px}
.ghost{background:transparent;border:1px solid #3d6a86;color:#d8eef9;border-radius:10px;min-height:40px;padding:0 12px}
.tabs{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:19;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;min-height:48px;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tab.on{color:var(--navy);border-bottom-color:var(--blue)}
.tab i{font-style:normal;color:var(--blue)}
main{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(140px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gap{gap:8px}
.muted{color:var(--muted)}.small{font-size:13px}.strong{font-weight:600}.blue{color:var(--blue)}.green{color:var(--green)}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.big2{font-size:19px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}
.err{color:#c62828;font-size:14px;margin:0;min-height:1em}
.center{min-height:80vh;display:grid;place-items:center}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-weight:600;font-size:14px}
input:not([type=checkbox]):not([type=file]){min-height:48px;border-radius:10px;border:1px solid #b9cfdc;padding:0 12px;background:#fff;color:var(--ink);width:100%}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}
.primary,.outline,.amberbtn,.done,.dashed,.finish,.navbtn,.routebtn,.filebtn{min-height:48px;border-radius:12px;font-weight:700;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.primary{background:var(--blue);color:#fff;border:0}
.outline{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.amberbtn{background:var(--amber);color:#fff;border:0}
.done{background:#e3f4ea;color:#1d5e3a;border:1px solid #c4e5d1}
.dashed{background:#fff;color:var(--navy);border:2px dashed var(--navy)}
.navbtn{background:var(--navy);color:#fff}.routebtn{background:var(--blue);color:#fff}
.finish{background:var(--green);color:#fff;border:0;flex-direction:column;min-height:58px}.finish small{font-weight:500;opacity:.9;font-size:12px}
button:disabled{opacity:.5}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:6px;cursor:pointer}
:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500!important}.check input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.login{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login .form{text-align:right}
.logo{width:72px;height:72px;border-radius:20px;background:#dcecf6;display:grid;place-items:center;margin:0 auto}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#dbe6ee;border-radius:12px;padding:4px}
.seg{border:0;background:transparent;min-height:42px;border-radius:9px;font-weight:600;color:var(--muted)}.seg.on{background:#fff;color:var(--navy)}
.tankcard{display:flex;flex-direction:column;gap:4px}
.request{width:100%;min-height:120px;border:0;border-radius:20px;background:var(--blue);color:#fff;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.request small{font-size:13px;font-weight:500;opacity:.85}
.steps{display:flex;flex-direction:column;gap:10px}.steps div{display:flex;gap:10px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #b9cfdc;background:#fff;flex:none}.dot.on{background:var(--green);border-color:var(--green)}
.hrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#fff;border:1px solid #e0e8ee;border-radius:12px;padding:10px 14px;font-size:14px}.hrow span:last-child{text-align:left;color:var(--muted)}
.notice{background:#fff4e2;border:1px solid #f1d4a6;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}.notice span{color:#6b5a44;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:11px;color:var(--muted)}
.kpi.blue b{color:var(--blue)}.kpi.green b{color:var(--green)}.kpi.amber b{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid #b9cfdc;background:#fff;color:var(--navy);font-size:13px;font-weight:600}
.ghostchip{border:0;background:transparent;color:var(--muted)}
.ocard{width:100%;display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r);background:#fff;border:2px solid var(--line);color:inherit;text-align:right;cursor:pointer}
.ocard.sel{background:#e8f3fa;border-color:var(--blue)}
.ocard .box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid #9fb6c4;display:grid;place-items:center;color:#fff;font-weight:700}
.ocard.sel .box{background:var(--blue);border-color:var(--blue)}
.ob{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}.pill.amber{background:#fdebd2;color:#8a4b00}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid #e0e8ee;border-radius:12px;padding:10px 12px;font-size:14px}
.duecard{background:var(--amberbg);border:1px solid #f1d9b5;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.duecard>div:first-child{display:flex;flex-direction:column}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.assignbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #cfdde6;box-shadow:0 -4px 14px rgba(12,59,86,.14);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.carbtn{min-width:52px;min-height:52px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.carbtn small{font-size:10px;font-weight:500;opacity:.85}
.map{height:300px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e4ece2}
.pin{display:grid!important;place-items:center;border-radius:50%;color:#fff;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin.busy{background:var(--blue)}.pin.free{background:#7b8a94}.pin.station{background:var(--navy);border-radius:6px}
.carrow{background:#fff;border:1px solid #e0e8ee;border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.cinfo{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}.capbox{display:flex;flex-direction:column;gap:2px;flex:0 1 180px}
.capbox input{min-height:40px!important}.capbox .outline{min-height:40px;padding:0 10px}
.prog{height:8px;background:#e2eef4;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.tankinfo{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.duty .row div{display:flex;flex-direction:column}
.trip{font-weight:700;color:var(--navy);padding-top:6px}
.back{font-weight:600;color:#8a4b00;background:#fdf1df;border-radius:10px;padding:8px 12px;font-size:14px}
.stop{display:flex;flex-direction:column;gap:10px}
.seq{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.warn{font-size:13px;color:#8a4b00;background:#fdf1df;padding:6px 10px;border-radius:8px}
.note{display:block;background:#fff4e2;color:#6b4a14;border-radius:8px;padding:4px 10px;font-size:13px;margin-top:4px}
.addr{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700;color:var(--navy);line-height:1.3}.addr svg{flex:none;color:var(--blue)}
.owner{font-size:20px;font-weight:600}
.drvnote{background:#fff4e2;border:2px solid #f1c27d;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.drvnote b{color:#8a4b00;font-size:13px}.drvnote span{font-size:16px;font-weight:600}
.callbtn{min-height:48px;border-radius:12px;border:2px solid var(--green);color:var(--green);background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none}
.sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(8,25,36,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.chip.on,.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
textarea{border-radius:10px;border:1px solid #b9cfdc;padding:10px 12px;font:inherit;font-size:16px;resize:none;width:100%}
.toast{visibility:hidden;position:fixed;transition:transform .2s,opacity .2s;left:16px;right:16px;top:calc(76px + env(safe-area-inset-top,0px));z-index:50;background:#173d2a;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2);transform:translateY(-20px);opacity:0;transition:transform .25s;max-width:560px;margin:0 auto}
.toast.show{transform:none;visibility:visible;opacity:1}.toast.bad{background:#7a1f1f}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
